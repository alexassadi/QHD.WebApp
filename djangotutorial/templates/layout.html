<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>
        {% block title %}
            Django App
        {% endblock %}
    </title>

    <div style="position: absolute; top: 10px; right: 20px; font-size: 0.9rem;">
        {% if user.is_authenticated %}
            Logged in as: <strong>{{ user.username }}</strong>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
        {% endif %}
    </div>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">


    <link rel="stylesheet" type="text/css" href="https://qhd-speech-training.s3.eu-west-2.amazonaws.com/css/style.css">
    <script src="https://qhd-speech-training.s3.eu-west-2.amazonaws.com/js/main.js" defer></script>


    <link rel="icon" href="https://qhd-speech-training.s3.eu-west-2.amazonaws.com/images/favicon.ico" type="image/x-icon">

    <style>
        body {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.body.classList.add("loaded");
        });
    </script>    
</head>
<body>
    <main>
        {% block content %}
        {% endblock %}
        {% block extra_js %}
        {% endblock %}
    </main>
</body>
</html>
